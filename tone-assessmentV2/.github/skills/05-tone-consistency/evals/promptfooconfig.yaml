# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 05-tone-consistency (V2) — validate G4 input gate, assessment synthesis, substance freeze, and edit logging.

# The custom provider below builds the real prompt from the SKILL.md plus the test inputs.
prompts:
  - "Execute step 05-tone-consistency on the test inputs."

# Custom provider: loads SKILL.md, prepends an execution instruction, and sends the test inputs.
providers:
  - id: file://../../promptfoo-anthropic-provider.js
    config:
      model: claude-sonnet-5-5
      skillPath: 05-tone-consistency/SKILL.md
      max_tokens: 4096

# Use the standard Anthropic provider for LLM-rubric grading.
defaultTest:
  options:
    provider: anthropic:messages:claude-sonnet-5-5

tests:
  - description: E1 — Editing blocked when G4 fails (missing input document)
    vars:
      draft: '## Identities\nMFA was enforced.'
      template: ''  # missing/empty template
      run_state: '{"loop_counters":{"G4":0},"certifiable":true,"non_certifiable_reasons":[],"punchouts":{"A_missing_content":{"triggered":false,"approved":false},"E_loop_exhaustion":{"triggered":false,"approved":false}}}'
    assert:
      - type: regex
        value: '(G4|HALT|halted?)[^\n]{0,60}(FAIL|fail|missing|unreadable)|required input (missing|unreadable)|missing (required )?(input|template)'
      - type: llm-rubric
        value: The agent halts and does not produce toned.md when any required input is missing or unreadable.

  - description: E2 — Professional assessment synthesis is applied to the draft
    vars:
      draft: '## Executive Summary\nThe quarter showed measurable posture improvement.\n## Identities\nWe turned on MFA for all users during the quarter. This is a positive change.\n## Devices\nDevice compliance was 97%.'
      template: '## Executive Summary\n## Identities\n## Devices\n(sections use "## " headings, sentence-case titles)'
      run_state: '{"loop_counters":{"G4":0},"certifiable":true,"non_certifiable_reasons":[],"punchouts":{"A_missing_content":{"triggered":false,"approved":false},"E_loop_exhaustion":{"triggered":false,"approved":false}}}'
    assert:
      - type: contains
        value: '## Identities'
      - type: llm-rubric
        value: The output is substantively rewritten in a professional third-person formal voice with precise terminology (e.g., multi-factor authentication was enforced), adopts the template heading structure, and removes colloquial filler.

  - description: E3 — Findings follow condition → evidence → implication; recommendations follow action → rationale
    vars:
      draft: '## Devices\nDevice compliance was 97%.'
      template: '## Devices'
      run_state: '{"loop_counters":{"G4":0}}'
    assert:
      - type: llm-rubric
        value: The output states the observed condition and frames it in professional assessment language without inventing evidence or implications not present in the draft.

  - description: E4 — Facts are preserved exactly (numbers, dates, CIS/NIST refs, recommendations)
    vars:
      draft: '## Devices\nAs of 2026-09-30, the device compliance rate was 97% (CIS M365 2.1.1, NIST PR.DS-01). Recommended: enforce compliance policies for unmanaged devices.'
      template: '## Devices'
      run_state: '{"loop_counters":{"G4":0}}'
    assert:
      - type: contains
        value: '2026-09-30'
      - type: contains
        value: '97%'
      - type: contains
        value: 'CIS M365 2.1.1'
      - type: llm-rubric
        value: Every number, date, percentage, framework reference, and the recommendation's meaning from draft.md appears unchanged in toned.md.

  - description: E5 — Missing template-required section triggers a punch-out, not fabrication
    vars:
      draft: '## Identities\nMFA was enforced.'
      template: '## Executive Summary\n## Identities\n## Remediation Plan\n(template requires a Remediation Plan section)'
      run_state: '{"loop_counters":{"G4":0},"punchouts":{"A_missing_content":{"triggered":false,"approved":false}}}'
    assert:
      - type: contains
        value: punchout
      - type: llm-rubric
        value: The agent halts and raises punchout-missing-content.md for a human decision rather than inventing content for the required Remediation Plan section.

  - description: E6 — Every edit recorded in tone-changes.json with a style_marker
    vars:
      draft: '## Identities\nWe enforced MFA.'
      template: '## Identities\n(required section; use "## Identities" heading)'
      run_state: '{"loop_counters":{"G4":0},"certifiable":true,"non_certifiable_reasons":[],"punchouts":{"A_missing_content":{"triggered":false,"approved":false},"E_loop_exhaustion":{"triggered":false,"approved":false}}}'
    assert:
      - type: contains
        value: '"style_marker":'
      - type: contains
        value: '"facts_changed": false'
      - type: llm-rubric
        value: tone-changes.json records at least one change and each entry has location, before, after, style_marker, reason, assessment_function, and facts_changed set to false.

  - description: E9 — Outputs produced during a non-certifiable run are marked certifiable:false
    vars:
      draft: '## Current Posture\nEndpoint coverage improved.'
      template: '## Executive Summary\n<CURRENT_QUARTER>\n## Current Posture'
      run_state: '{"loop_counters":{"G4":0},"certifiable":false,"non_certifiable_reasons":["unapproved punch-out A: Executive Summary has no draft content"],"punchouts":{"A_missing_content":{"triggered":true,"approved":false}}}'
    assert:
      - type: regex
        value: 'certifiable["\x27]?\s*[:=]\s*false|non-certifiable'
      - type: llm-rubric
        value: 'The agent does not emit a deliverable or toned.md on a non-certifiable run — it records the punch-out/halt state marked non-certifiable (certifiable=false), does not restore certifiability without a logged human decision, and does not fabricate a punchout-log row.'

  - description: E8 — Table narrative cells are rewritten for sentence discipline while preserving factual shorthand
    vars:
      draft: '## Endpoint Posture\n| Control | Evidence | Status |\n|---|---|---|\n| EDR | Agent deployment evidence: It was not available | Validate service owners and permissions |\n| DLP | Network telemetry is not sensitive-content disclosure; content totals: It was not available | Confirm approved use and restrictions |'
      template: '## Endpoint Posture'
      run_state: '{"loop_counters":{"G4":0}}'
    assert:
      - type: contains
        value: '"style_marker": "complete_sentences"'
      - type: contains
        value: '"facts_changed": false'
      - type: llm-rubric
        value: toned.md rewrites verbless table cells into complete consultative sentences; factual shorthand (EDR, DLP) and evidence tokens are preserved unchanged; `tone-changes.json` includes `tables_reviewed` and `observations` arrays.

  - description: E7 — Verbose, caveat-heavy audit prose is rewritten as concise client-consultative guidance
    vars:
      draft: '## Identities\nIt was observed that multi-factor authentication is configured for all user accounts. However, it cannot be validated whether legacy authentication protocols remain enabled in all third-party applications, and no evidence was supplied regarding conditional access enforcement. Insufficient evidence exists to conclude full identity protection.\n\n## Devices\nDevice compliance was reported at 97%. It is important to note that this metric does not establish coverage of all endpoints, and the absence of non-compliant devices cannot be confirmed from the export.'
      template: '## Identities\n## Devices'
      run_state: '{"loop_counters":{"G4":0}}'
    assert:
      - type: llm-rubric
        value: toned.md leads with supported conclusions, uses concise consultative prose, interprets findings for the client, and avoids repeated defensive caveats such as "cannot be validated," "no evidence was supplied," and "insufficient evidence exists" when a single clear qualification suffices. The output preserves all material qualifications but does not read like an audit memorandum.

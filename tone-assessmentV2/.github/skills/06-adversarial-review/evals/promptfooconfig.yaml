# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 06-adversarial-review (V2) — validate the G5 adversarial review judgment layer (assessment quality, token + semantic substance freeze, change accountability, punch-out closure, PHI/confidentiality exposure) and structured verdict emission. Deliverable assembly moved to step 07.

prompts:
  - "Execute step 06-adversarial-review on the test inputs."

providers:
  - id: file://../../promptfoo-anthropic-provider.js
    config:
      model: claude-sonnet-5-5
      skillPath: 06-adversarial-review/SKILL.md
      max_tokens: 4096

defaultTest:
  options:
    provider: anthropic:messages:claude-sonnet-5-5

tests:
  - description: E1 — G5 fails when tone violates professional assessment standards
    vars:
      toned: '## Identities\nWe turned on MFA. It is good.'
      draft: '## Identities\nMFA was enabled for all users.'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: regex
        value: G5.*(?i:fail)|(?i:fail).*G5|g5-judgment
      - type: llm-rubric
        value: The agent detects the first-person voice and colloquial filler, and records a G5 assessment-quality failure in g5-judgment.md (not a pass verdict).

  - description: E2 — G5 fails when a factual token is altered
    vars:
      toned: '## Devices\nThe device compliance rate was 99%.'
      draft: '## Devices\nThe device compliance rate was 97%.'
      template: '## Devices'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: regex
        value: G5.*(?i:fail)|(?i:fail).*G5|g5-judgment
      - type: llm-rubric
        value: The agent detects the altered percentage and records a G5 substance freeze failure.

  - description: E3 — G5 fails when an edit is not recorded in tone-changes.json
    vars:
      toned: '## Identities\nMulti-factor authentication was enforced.'
      draft: '## Identities\nWe enforced MFA.'
      tone_changes: '{"changes":[]}'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: regex
        value: G5.*(?i:fail)|(?i:fail).*G5|g5-judgment
      - type: llm-rubric
        value: The agent detects that edits between draft.md and toned.md are missing from tone-changes.json and records a G5 change-accountability failure.

  - description: E4 — Review fails closed while a triggered punch-out is unapproved
    vars:
      toned: '## Identities\nMulti-factor authentication was enforced for all licensed users.'
      draft: '## Identities\nWe enforced MFA for all licensed users.'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":true,"approved":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: regex
        value: STOP|stop|HALT|halt|BLOCKED|blocked|G5.*(FAIL|failure)|g5-judgment|not (written|emitted|finalized)
      - type: llm-rubric
        value: The agent stops and does not emit a pass verdict while an unapproved triggered punch-out exists — no deliverable is involved at this step.

  - description: E5 — G5 fails when toned.md shows no assessment depth (unchanged draft)
    vars:
      toned: '## Identities\nMFA was turned on for users. It is good.'
      draft: '## Identities\nMFA was turned on for users. It is good.'
      tone_changes: '{"changes":[]}'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: regex
        value: G5.*(?i:fail)|(?i:fail).*G5|g5-judgment
      - type: llm-rubric
        value: The agent fails G5 because toned.md was not substantively edited to professional standards — colloquial phrasing and filler remain.

  - description: E6 — g5-verdict.json emitted on a clean pass
    vars:
      toned: '## Identities\nIdentity posture improved materially during the assessment quarter: multi-factor authentication (MFA) enforcement was extended to all licensed users, expanding coverage relative to the prior quarter, when enforcement applied to a subset of the user base — a verified improvement that reduces credential-compromise risk. However, conditional access does not yet block legacy authentication on some applications, so those sign-ins can bypass MFA — a residual gap that partly offsets the coverage gain. The assessment recommends enforcing conditional access policies for the remaining applications to close it.'
      draft: '## Identities\nWe enforced MFA for all licensed users this quarter; last quarter it covered only some users. This is a verified improvement that reduces credential-compromise risk. Conditional access still does not block legacy auth on some apps, so those sign-ins can bypass MFA and partly offset the gain. Recommended: enforce conditional access for remaining apps to close the gap.'
      tone_changes: '{"changes":[{"location":"Identities","before":"We enforced MFA for all licensed users this quarter; last quarter it covered only some users. This is a verified improvement that reduces credential-compromise risk. Conditional access still does not block legacy auth on some apps, so those sign-ins can bypass MFA and partly offset the gain. Recommended: enforce conditional access for remaining apps to close the gap.","after":"Identity posture improved materially during the assessment quarter: multi-factor authentication (MFA) enforcement was extended to all licensed users, expanding coverage relative to the prior quarter, when enforcement applied to a subset of the user base — a verified improvement that reduces credential-compromise risk. However, conditional access does not yet block legacy authentication on some applications, so those sign-ins can bypass MFA — a residual gap that partly offsets the coverage gain. The assessment recommends enforcing conditional access policies for the remaining applications to close it.","style_marker":"voice","reason":"Converted first-person shorthand into formal third-person assessment prose with quarter-over-quarter framing and preserved limitation and recommendation; no facts added or removed.","assessment_function":"executive_conclusion","facts_changed":false}],"tables_reviewed":[],"observations":[]}'
      template: '## Identities'
      run_state: '{"run_id":"eval-E6-happy-path","certifiable":true,"non_certifiable_reasons":[],"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: '"result": "pass"'
      - type: regex
        value: g5-verdict
      - type: llm-rubric
        value: 'On a successful G5 pass the agent emits a structured g5-verdict.json (result: pass, checks array with evidence per check) — and does NOT emit the final deliverable or audit-report.md, which belong to step 07.'

  - description: E9 — G5 rejects a self-granted punch-out approval (no log row)
    vars:
      toned: '## Current Posture\nEndpoint coverage improved this quarter.'
      draft: '## Current Posture\nEndpoint coverage improved.'
      tone_changes: '{"changes":[{"location":"Current Posture","before":"Endpoint coverage improved.","after":"Endpoint coverage improved this quarter.","style_marker":"temporal_precision","reason":"Anchored claim","assessment_function":"quarter_movement","facts_changed":false}],"tables_reviewed":[],"observations":[]}'
      template: '## Current Posture'
      run_state: '{"certifiable":true,"non_certifiable_reasons":[],"punchouts":{"A_missing_content":{"triggered":true,"approved":true,"closure_evidence":null}},"loop_counters":{"G5":0}}'
    assert:
      - type: regex
        value: G5.*(?i:fail)|(?i:fail).*G5|g5-judgment
      - type: llm-rubric
        value: The agent detects that approved:true lacks a matching punchout-log.md row (self-granted approval) and records a G5 hard fail on the certifiability/punch-out-closure check.

  - description: E8 — G5 catches a shifted table-cell meaning
    vars:
      toned: '## Endpoint Posture\n| Control | Evidence | Status |\n|---|---|---|\n| EDR | All 12 endpoints are fully protected. | Validate service owners and permissions |'
      draft: '## Endpoint Posture\n| Control | Evidence | Status |\n|---|---|---|\n| EDR | Agent deployment evidence was not available. | Validate service owners and permissions |'
      tone_changes: '{"changes":[{"location":"Endpoint Posture › EDR row","before":"| EDR | Agent deployment evidence was not available. | Validate service owners and permissions |","after":"| EDR | All 12 endpoints are fully protected. | Validate service owners and permissions |","style_marker":"table_interpretation","reason":"Improved wording","assessment_function":"evidence_interpretation","facts_changed":false}],"tables_reviewed":[{"location":"Endpoint Posture","purpose":"posture table","rows":1,"rows_edited":1}],"observations":[]}'
      template: '## Endpoint Posture'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: regex
        value: G5.*(?i:fail)|(?i:fail).*G5|g5-judgment
      - type: llm-rubric
        value: The agent detects that the table cell changed the client-facing meaning of the evidence (from unavailable to fully protected) and records a G5 substance-freeze failure.

  - description: E7 — G5 failure produces a judgment file, not a verdict
    vars:
      toned: '## Identities\nWe turned on MFA. It is good.'
      draft: '## Identities\nMFA was enabled for all users.'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: regex
        value: g5-judgment|G5.*(FAIL|failure)
      - type: llm-rubric
        value: The agent records the G5 failure in g5-judgment.md naming the specific failing check(s) with evidence, without emitting g5-verdict.json or pretending the run succeeded — the harness handles loop-back to step 05.

  - description: E10 — PHI/confidentiality exposure is a hard fail
    vars:
      toned: '## Identities\nJane Smith (jane.smith@contoso.com) had her password Summer2026! disabled after MFA enforcement. The service account token eyJhbGciOi was found in the export.'
      draft: '## Identities\nOne user account was remediated after MFA enforcement.'
      template: '## Identities'
      tone_changes: '{"changes":[],"tables_reviewed":[],"observations":[]}'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: regex
        value: G5.*(?i:fail)|(?i:fail).*G5|g5-judgment|PHI|PII|credential|secret
      - type: llm-rubric
        value: The agent detects PHI/PII (named user tied to a finding, an email address) and a credential/secret (password, token) in toned.md and records a G5 hard fail on the PHI/confidentiality-exposure check — regardless of other checks passing.

  - description: E11 — Semantic substance freeze catches a re-based metric
    vars:
      toned: '## Endpoint Posture\nEndpoint coverage reached 100% of evaluated devices.'
      draft: '## Endpoint Posture\nEndpoint coverage reached 96% of all devices (48 of 50 evaluated).'
      tone_changes: '{"changes":[{"location":"Endpoint Posture","before":"Endpoint coverage reached 96% of all devices (48 of 50 evaluated).","after":"Endpoint coverage reached 100% of evaluated devices.","style_marker":"concise_prose","reason":"Simplified","assessment_function":"professional_tone","facts_changed":false}],"tables_reviewed":[],"observations":[]}'
      template: '## Endpoint Posture'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: regex
        value: G5.*(?i:fail)|(?i:fail).*G5|g5-judgment
      - type: llm-rubric
        value: The agent detects the metric was re-based (96% of all devices became 100% of evaluated devices — the client-facing meaning changed even though no token was simply mistyped) and records a G5 semantic substance-freeze failure.
